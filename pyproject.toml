[project]
name = "taiwan_civilcode_agent"
version = "0.1.0"
description = ""
authors = [
    { name = "Hao-En Chen", email = "92917339+hank1224@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<4.0"
dependencies = [
    "langgraph>=0.2.6",
    "langchain>=0.2.14",
    "langchain-fireworks>=0.1.7",
    "python-dotenv>=1.0.1",
    "pydantic>=2.11.3",
    "langchain_openai>=0.3.14",
    "langchain_google_genai>=2.1.3",
    "langchain_postgres>=0.0.14",
    "psycopg[binary,pool]>=3.2.6",
]


[project.optional-dependencies]
dev = ["mypy>=1.15", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taiwan_civilcode_agent"]
[tool.setuptools.package-dir]
"taiwan_civilcode_agent" = "src/taiwan_civilcode_agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8 errors)
    "W",   # pycodestyle warnings (PEP 8 warnings)
    "F",   # pyflakes (potential bugs/errors)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions (list/dict/set comprehensions)
    "UP",  # pyupgrade (modernize code)
    "S",   # flake8-bandit (basic security implications)
    "A",   # flake8-builtins (shadowing builtins)
    "SIM", # flake8-simplify (simplify code)
    "ISC", # flake8-implicit-str-concat (implicit string concatenation)
    "PL",  # pylint (subset of pylint rules)
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2",
    "pytest>=8.3.5",
]
